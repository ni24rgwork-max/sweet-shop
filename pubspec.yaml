name: sweet_shop
description: "A bakery storefront app built with Flutter and Material 3 Expressive."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^17.3.0

  # Design system
  google_fonts: ^8.2.0
  material_symbols_icons: ^4.2960.0
  animations: ^2.2.0

  # Assets & content
  flutter_gen: ^5.10.0
  readmore: ^3.0.0
  dotted_border: ^3.1.0

  # Map
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter:
  uses-material-design: true

  assets:
    - assets/images/
